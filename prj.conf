# Custom PCB has no usable UART console. The board overlay also deletes the
# console nodes, and these options keep serial support out of the application.
CONFIG_UART_ASYNC_API=n
CONFIG_NRFX_UARTE0=n
CONFIG_SERIAL=n
CONFIG_UART_CONSOLE=n

# GPIO drives the lighting outputs and reads the strobe fault input.
CONFIG_GPIO=y

# No runtime console path is available on the lightboard hardware.
CONFIG_CONSOLE=n
CONFIG_PRINTK=n
CONFIG_RTT_CONSOLE=n

# BLE role and pairing support. This image is the central/GATT client that
# connects to the steering-wheel peripheral and subscribes to NUS notifications.
CONFIG_BT=y
CONFIG_BT_CENTRAL=y
CONFIG_BT_SMP=y
CONFIG_BT_GATT_CLIENT=y
CONFIG_BT_MAX_CONN=1
CONFIG_BT_MAX_PAIRED=1

# NCS helpers used by main.c:
# - NUS client receives one-byte steering-wheel commands.
# - Scan module applies the NUS UUID filter and auto-connects on match.
# - GATT discovery manager finds and assigns the peripheral's NUS handles.
CONFIG_BT_NUS_CLIENT=y
CONFIG_BT_SCAN=y
CONFIG_BT_SCAN_FILTER_ENABLE=y
CONFIG_BT_SCAN_UUID_CNT=1
CONFIG_BT_GATT_DM=y

# Extra headroom for Bluetooth helpers and the callback/workqueue path.
CONFIG_HEAP_MEM_POOL_SIZE=2048
CONFIG_SYSTEM_WORKQUEUE_STACK_SIZE=2048

# Bonding storage. Pairing is Just Works; bonds persist in flash through the
# Settings subsystem and are loaded again on boot.
CONFIG_BT_SETTINGS=y
CONFIG_FLASH=y
CONFIG_FLASH_PAGE_LAYOUT=y
CONFIG_FLASH_MAP=y

# Disable logging entirely to save memory and because there is no log transport.
CONFIG_LOG=n
CONFIG_USE_SEGGER_RTT=n
CONFIG_LOG_BACKEND_RTT=n
CONFIG_LOG_BACKEND_UART=n
CONFIG_LOG_PRINTK=n

# Keep assertions enabled while the firmware is still under active development.
CONFIG_ASSERT=y

# nRF54L15 GPIOTE blocks required by gpio_pin_interrupt_configure() for the
# STROBE_IN edge interrupt.
CONFIG_NRFX_GPIOTE20=y
CONFIG_NRFX_GPIOTE30=y

# Custom PCB has no external 32 kHz crystal; use the internal RC source.
CONFIG_CLOCK_CONTROL_NRF_K32SRC_RC=y
CONFIG_CLOCK_CONTROL_NRF_K32SRC_500PPM=y

# Allow Zephyr and device drivers to enter low-power states while idle.
CONFIG_PM=y
CONFIG_PM_DEVICE=y
