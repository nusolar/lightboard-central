# No UART on the custom PCB — overlay also deletes the console nodes.
CONFIG_UART_ASYNC_API=n
CONFIG_NRFX_UARTE0=n
CONFIG_SERIAL=n
CONFIG_UART_CONSOLE=n

CONFIG_GPIO=y

# Route printk to SEGGER RTT (LOG_* goes through LOG_BACKEND_RTT separately).
CONFIG_CONSOLE=y
CONFIG_RTT_CONSOLE=y

# BLE stack — Central / GATT Client
CONFIG_BT=y
CONFIG_BT_CENTRAL=y
CONFIG_BT_SMP=y
CONFIG_BT_GATT_CLIENT=y
CONFIG_BT_MAX_CONN=1
CONFIG_BT_MAX_PAIRED=1

# NCS BLE helpers
CONFIG_BT_NUS_CLIENT=y
CONFIG_BT_SCAN=y
CONFIG_BT_SCAN_FILTER_ENABLE=y
CONFIG_BT_SCAN_UUID_CNT=1
CONFIG_BT_SCAN_ADDRESS_CNT=1
CONFIG_BT_GATT_DM=y

CONFIG_HEAP_MEM_POOL_SIZE=2048
CONFIG_SYSTEM_WORKQUEUE_STACK_SIZE=2048

# Bonding (Just Works) → flash via Settings subsystem
CONFIG_BT_SETTINGS=y
CONFIG_FLASH=y
CONFIG_FLASH_PAGE_LAYOUT=y
CONFIG_FLASH_MAP=y

# Logging over SEGGER RTT
CONFIG_LOG=y
CONFIG_USE_SEGGER_RTT=y
CONFIG_LOG_BACKEND_RTT=y
CONFIG_LOG_BACKEND_UART=n
CONFIG_LOG_PRINTK=y

CONFIG_ASSERT=y

# DK helpers — bench-only; harmless on the custom PCB because DT aliases are deleted in app.overlay.
CONFIG_DK_LIBRARY=y

# nRF54L15 GPIOTE blocks (required for gpio_pin_interrupt_configure on STROBE_IN and future inputs).
CONFIG_NRFX_GPIOTE20=y
CONFIG_NRFX_GPIOTE30=y

# Custom PCB has no external 32 kHz crystal — use internal RC. 500 PPM is fine for BLE.
CONFIG_CLOCK_CONTROL_NRF_K32SRC_RC=y
CONFIG_CLOCK_CONTROL_NRF_K32SRC_500PPM=y

# Power management
CONFIG_PM=y
CONFIG_PM_DEVICE=y
